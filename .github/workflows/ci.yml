name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Sin backend LLM, sin Docker y sin API keys. Todo lo que necesite alguno de
# los tres debe SALTAR de forma visible, nunca fallar y nunca pasar callado.
env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install --no-cache-dir ruff==0.16.1

      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # lib/version.py deriva la revision de git; sin historial no hay SHA.
          fetch-depth: 0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir \
            pytest==9.0.3 \
            weasyprint==68.1 \
            jinja2==3.1.4 \
            pyyaml==6.0.3 \
            requests==2.34.2 \
            flask==3.0.0 \
            flask-login==0.6.3

      - name: Report the environment the suite runs in
        run: |
          echo "No LLM backend is provisioned in CI."
          echo "LLM_BASE_URL=${LLM_BASE_URL:-<unset>}"
          echo "Tests that need one must report as SKIPPED below, with a reason."

      # -r a prints the reason for every skip in the final summary, so a test
      # that did not run is visible in the log instead of vanishing.
      - name: Smoke tests
        run: python -m pytest tests/ -r a

      - name: Agent layer tests
        run: |
          set -o pipefail
          python -m pytest openclaw/tests/ -r a | tee /tmp/agent-tests.txt

      - name: Assert the backend tests skipped
        # No LLM endpoint is provisioned here, so those tests MUST skip. If
        # they pass instead, either a backend leaked into CI or they stopped
        # checking one — both make the test decorative.
        run: |
          if ! grep -q 'SKIPPED' /tmp/agent-tests.txt; then
            echo "::error::Expected the backend tests to skip without an LLM endpoint."
            exit 1
          fi
          echo "Backend tests skipped as expected:"
          grep 'SKIPPED' /tmp/agent-tests.txt

  cli:
    name: shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Syntax check
        run: bash -n crowsnest.sh

      - name: Help exits cleanly
        run: bash crowsnest.sh help

      - name: Unknown command fails
        run: |
          if bash crowsnest.sh definitely-not-a-command >/dev/null 2>&1; then
            echo "::error::An unknown command exited 0."
            exit 1
          fi

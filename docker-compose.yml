# =============================================================================
# CROWSNEST — Docker Compose
# Uso: docker-compose up -d && docker-compose exec crowsnest bash
# =============================================================================

services:
  crowsnest:
    build:
      context: .
      dockerfile: Dockerfile
    # Nombre de imagen explicito: sin esto compose la nombra <directorio>-<servicio>
    # y crowsnest.sh no la encuentra si el repo se clona con otro nombre.
    image: crowsnest:latest
    container_name: crowsnest

    # -------------------------------------------------------------------------
    # Variables de entorno — define tus API keys en el archivo .env
    # NUNCA subas el .env a Git (está en .gitignore)
    # -------------------------------------------------------------------------
    env_file: .env

    # -------------------------------------------------------------------------
    # Volúmenes — persistencia de datos entre sesiones
    # -------------------------------------------------------------------------
    volumes:
      # Resultados de auditorías (no se borran al apagar el contenedor)
      - ./reportes:/home/work/results

      # Templates de nuclei (se actualizan sin reconstruir la imagen)
      - ./config/nuclei:/root/.nuclei-templates

      # Configuración de subfinder (config.yaml + provider-config.yaml con API keys)
      - ./config:/root/.config/subfinder

      # Scripts de automatización (edítalos en tu host, se reflejan al instante)
      - ./scripts:/home/work/scripts

      # Lista de dominios objetivo (targets.txt, etc.)
      - ./targets:/home/work/targets

    # -------------------------------------------------------------------------
    # Red: host permite que nmap y otras herramientas funcionen correctamente
    # NOTA: en macOS usar 'bridge' en su lugar
    # -------------------------------------------------------------------------
    network_mode: host

    # -------------------------------------------------------------------------
    # Modo interactivo
    # -------------------------------------------------------------------------
    stdin_open: true
    tty: true

    # -------------------------------------------------------------------------
    # Recursos — evita que nuclei consuma toda la RAM del host
    # -------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

    # Reinicio manual solamente
    restart: "no"
